name: MornyeLite
options:
  deploymentTarget:
    iOS: "12.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    SWIFT_INCLUDE_PATHS: $(SRCROOT)/build/backend/include $(SRCROOT)/build/opus/include
    DEAD_CODE_STRIPPING: YES
targets:
  MornyeBackend:
    type: framework.static
    platform: iOS
    sources:
      - path: build/backend/MornyeBackend.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.naufalardh.mornyelite.backend
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
  MornyeLite:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - target: MornyeBackend
        embed: false
      - sdk: Security.framework
      - sdk: SystemConfiguration.framework
      - sdk: CoreFoundation.framework
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_NAME: MornyeLite
        PRODUCT_BUNDLE_IDENTIFIER: com.naufalardh.mornyelite
        INFOPLIST_FILE: App/Info.plist
        MARKETING_VERSION: "5.4.5" # matches vendored Mornye; extensions gate on it
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/build/backend $(SRCROOT)/build/opus
        OTHER_LDFLAGS: -lmornye_mobile -lopus -lc++ -lresolv -lz
