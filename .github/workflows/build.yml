name: Build IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          cd vendor/Mornye/rust_backend && rustup show

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            vendor/Mornye/rust_backend/target
          key: cargo-ios12-${{ hashFiles('vendor/Mornye/rust_backend/Cargo.lock', 'vendor/Mornye/rust_backend/rust-toolchain.toml', 'scripts/build_backend.sh') }}
          restore-keys: cargo-ios12-

      - name: Build Rust backend (iOS 12, arm64)
        run: bash scripts/build_backend.sh

      - name: Build libopus (iOS 12, arm64)
        run: bash scripts/build_opus.sh

      - uses: actions/cache@v4
        with:
          path: build/ffmpeg-libs
          key: ffmpeg-ios12-${{ hashFiles('scripts/build_ffmpeg.sh') }}

      - name: Build audio-only FFmpeg (iOS 12, arm64)
        run: bash scripts/build_ffmpeg.sh

      - name: Build app
        run: |
          xcodegen generate
          xcodebuild -project MornyeLite.xcodeproj -scheme MornyeLite -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/dd \
            CODE_SIGNING_ALLOWED=NO build | tail -200
          test "${PIPESTATUS[0]}" = 0

      - name: Package unsigned IPA
        run: |
          app=build/dd/Build/Products/Release-iphoneos/MornyeLite.app
          otool -l "$app/MornyeLite" | grep -A4 LC_VERSION_MIN_IPHONEOS || otool -l "$app/MornyeLite" | grep -A5 LC_BUILD_VERSION
          mkdir -p build/ipa/Payload
          cp -R "$app" build/ipa/Payload/
          (cd build/ipa && zip -qry ../MornyeLite-unsigned.ipa Payload)
          ls -la build/MornyeLite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: MornyeLite-unsigned-ipa
          path: build/MornyeLite-unsigned.ipa

      - name: Publish nightly
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/MornyeLite-unsigned.ipa build/LiteP-nightly-unsigned.ipa
          gh release delete nightly --cleanup-tag -y || true
          gh release create nightly build/LiteP-nightly-unsigned.ipa --prerelease --target "$GITHUB_SHA" \
            --title "LiteP nightly" \
            --notes "Automatic build of ${GITHUB_REF_NAME} at ${GITHUB_SHA::7}. Untested; use the latest numbered release for a stable build. Unsigned IPA for iOS 12+: sideload with Sideloadly, or ldid -S and install with AppSync Unified."

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/MornyeLite-unsigned.ipa --title "$GITHUB_REF_NAME" --notes "Unsigned IPA for iOS 12+. Sideload with Sideloadly."
